name: Feature request
description: Suggest a capability, improvement, or developer-experience change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem first, then the solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the use case, not just the implementation.
      placeholder: "I want to save only a specific chapter of a long video..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like ReelRelay to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Download formats / quality
        - Audio tagging
        - UI / UX
        - Platform support
        - Performance / reliability
        - Developer experience / tests
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This request does not require bypassing DRM, paywalls or private-account access.
          required: true
