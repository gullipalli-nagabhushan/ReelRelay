name: reelrelay

services:
  reelrelay:
    build:
      context: ..
      dockerfile: Dockerfile
    image: reelrelay:3.0.0
    restart: unless-stopped
    env_file:
      - /etc/reelrelay/reelrelay.env
    # Only Caddy should reach the app, never the public internet.
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      # Read-only config (and optional cookies.txt) for yt-dlp.
      - /etc/reelrelay:/etc/reelrelay:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
